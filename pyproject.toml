[project]
name = "second-act"
version = "0.1.0"
description = "A half-time tactical read that checks itself: multi-agent match intelligence over synthetic football data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.8,<3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "agent-framework-foundry>=1.15.0",
    "azure-identity>=1.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
second-act-generate = "second_act.sim.cli:main"
second-act-signals = "second_act.analytics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_act"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
