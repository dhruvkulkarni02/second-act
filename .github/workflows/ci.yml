name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECOND_ACT_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Lint
        run: |
          .venv/bin/ruff check src tests scripts
          .venv/bin/ruff format --check src tests scripts
      - name: Test (offline, no model calls)
        run: .venv/bin/pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t second-act:ci .
      - name: Smoke test the container (offline)
        run: |
          docker run -d --name sa -p 8000:8000 -e SECOND_ACT_OFFLINE=true second-act:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/matches | grep -q m-001
          curl -sf localhost:8000/ | grep -q "Second Act"
          docker logs sa | tail -5

  publish:
    # Builds the deployable image and pushes it to GitHub Container Registry (main only).
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/second-act:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/second-act:latest
